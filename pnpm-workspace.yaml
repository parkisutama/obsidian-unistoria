# pnpm settings (pnpm >= 11 no longer reads non-auth settings from .npmrc)

# Packages allowed to run install scripts: each one fetches or validates a platform binary.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  rumdl: true

# eslint-plugin-obsidianmd pins its obsidian peer to 1.8.7; the plugin targets a newer API.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-obsidianmd>obsidian": "1.13.1"
